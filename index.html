<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Games! 🎮</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Verdana, sans-serif;
    background: linear-gradient(#5ec8ff, #ffe56a 52%, #8ee08a);
    color: #2a1466;
  }
  h1 {
    margin: 0 0 36px;
    font-size: clamp(2.6rem, 11vw, 5.2rem);
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-shadow: 0 4px 0 #fff, 0 8px 0 rgba(42, 20, 102, 0.12);
  }
  a.play {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: min(100%, 520px);
    min-height: 120px;
    padding: 28px 24px;
    border-radius: 32px;
    border: 6px solid #fff;
    background: #ff4d8d;
    color: #fff;
    font-size: clamp(1.8rem, 7vw, 3rem);
    font-weight: 800;
    line-height: 1.15;
    text-decoration: none;
    box-shadow: 0 10px 0 #c2185b;
  }
  a.play:active {
    transform: translateY(6px);
    box-shadow: 0 4px 0 #c2185b;
  }
</style>
</head>
<body>
  <h1>Our Games! 🎮</h1>
  <a class="play" href="rainbow-rocket-jet/">🚀 Rainbow Rocket Jet</a>
</body>
</html>
