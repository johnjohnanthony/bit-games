<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rainbow Rocket Jet</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#5ec8ff,#bfeaff 70%,#9be59b 70%,#6fd36f);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;position:fixed;inset:0}
#sign{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border:6px solid #ff5fa2;border-radius:24px;padding:10px 22px;font-size:clamp(28px,7vw,60px);font-weight:bold;color:#3a2a8a;white-space:nowrap;z-index:5;box-shadow:0 6px 0 #0002}
#stars{position:absolute;bottom:14px;right:16px;font-size:clamp(24px,5vw,40px);font-weight:bold;color:#fff;text-shadow:0 2px 4px #0006;z-index:5}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50%;height:160%;left:15%;top:-70%}.cloud::after{width:40%;height:130%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#rocket{position:absolute;left:0;top:0;width:min(70vw,60vh);cursor:pointer;z-index:3;transform-origin:50% 50%;will-change:transform}
#rocket svg{width:100%;height:auto;display:block;pointer-events:none}
.fx{position:absolute;pointer-events:none;z-index:4;font-size:clamp(28px,6vw,50px)}
.pilot{position:absolute;pointer-events:none;z-index:4;text-align:center;font-size:clamp(40px,9vw,80px);line-height:1}
.puff{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;pointer-events:none;z-index:2;opacity:.8}
</style>
</head>
<body>
<div id="sign" role="status">TAP THE ROCKET! 🚀</div>
<div id="stars">⭐ x 0</div>
<div id="rocket" role="button" aria-label="rocket" tabindex="0">
<svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="rb" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ff4d4d"/><stop offset=".17" stop-color="#ff4d4d"/><stop offset=".17" stop-color="#ff9a1f"/><stop offset=".34" stop-color="#ff9a1f"/><stop offset=".34" stop-color="#ffe23a"/><stop offset=".5" stop-color="#ffe23a"/><stop offset=".5" stop-color="#3fd45a"/><stop offset=".67" stop-color="#3fd45a"/><stop offset=".67" stop-color="#3fa0ff"/><stop offset=".84" stop-color="#3fa0ff"/><stop offset=".84" stop-color="#9b5cff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient></defs>
<path d="M120 70 L80 10 L110 10 L170 70Z" fill="#9b5cff" stroke="#3a2a8a" stroke-width="4" stroke-linejoin="round"/>
<path d="M120 90 L80 150 L110 150 L170 90Z" fill="#3fa0ff" stroke="#3a2a8a" stroke-width="4" stroke-linejoin="round"/>
<path d="M40 60 L20 30 L45 30 L65 60Z" fill="#ff9a1f" stroke="#3a2a8a" stroke-width="4" stroke-linejoin="round"/>
<path d="M40 50 H230 Q290 80 230 110 H40 Q30 80 40 50Z" fill="url(#rb)" stroke="#3a2a8a" stroke-width="5" stroke-linejoin="round"/>
<path d="M230 50 Q290 80 230 110 Z" fill="#ff5fa2" stroke="#3a2a8a" stroke-width="4"/>
<ellipse cx="185" cy="66" rx="26" ry="12" fill="#bff3ff" stroke="#3a2a8a" stroke-width="4"/>
<circle cx="120" cy="80" r="11" fill="#fff" stroke="#3a2a8a" stroke-width="3"/>
<rect x="28" y="62" width="14" height="36" rx="5" fill="#ccc" stroke="#3a2a8a" stroke-width="4"/>
</svg>
</div>
<script>
(()=>{
const rocket=document.getElementById('rocket'),sign=document.getElementById('sign'),starsEl=document.getElementById('stars');
let state='enter',t0=performance.now(),pops=0,x=-500,y=200,ctx=null,scale=1;
window.gameState=()=>state;
const W=()=>innerWidth,H=()=>innerHeight;
// clouds
for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cloud';const w=80+Math.random()*120;
Object.assign(c.style,{width:w+'px',height:w*.35+'px',top:(15+Math.random()*45)+'%',left:'0',animationDuration:(25+Math.random()*25)+'s',animationDelay:(-Math.random()*40)+'s'});document.body.appendChild(c);}
// audio
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(type,f1,f2,dur,vol=0.2,delay=0){const c=ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
o.type=type;o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(f2,s+dur);
g.gain.setValueAtTime(0.001,s);g.gain.exponentialRampToValueAtTime(vol,s+0.03);g.gain.exponentialRampToValueAtTime(0.001,s+dur);
o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+dur+0.05)}
const zoom=()=>{tone('sawtooth',120,900,0.7,0.08);tone('sine',200,1200,0.7,0.12)};
const stretch=()=>tone('triangle',180,700,1.8,0.15);
const pop=()=>tone('sine',600,80,0.18,0.35);
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone('sine',f,f,0.5,0.18,i*0.15));
function setSign(s){sign.textContent=s}
function place(){const r=rocket.getBoundingClientRect();rocket.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function rw(){return rocket.offsetWidth} function rh(){return rocket.offsetHeight}
function enter(){state='enter';t0=performance.now();scale=1;x=-rw();rocket.style.opacity=1;setSign('TAP THE ROCKET! 🚀');if(ctx)zoom()}
function tap(){ac();if(state==='enter'||state==='fly'){state='grow';t0=performance.now();setSign('IT GETS BIG! 🎈');stretch()}}
rocket.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('dblclick',e=>e.preventDefault());
function fx(txt,cx,cy,dx,dy,life){const d=document.createElement('div');d.className='fx';d.textContent=txt;document.body.appendChild(d);
const s=performance.now();(function step(n){const k=(n-s)/life;if(k>=1){d.remove();return}
d.style.transform=`translate(${cx+dx*k}px,${cy+dy*k+200*k*k}px) scale(${1+k})`;d.style.opacity=1-k;requestAnimationFrame(step)})(s)}
let pilots=[];
function burst(){const cx=x+rw()/2,cy=y+rh()/2;const em=['⭐','🌟','✨','💖','💜','💛'];
for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r=150+Math.random()*150;fx(em[i%em.length],cx-20,cy-20,Math.cos(a)*r,Math.sin(a)*r,1200)}
const n=3,top=Math.max(sign.getBoundingClientRect().bottom+10,cy-60);
for(let i=0;i<n;i++){const p=document.createElement('div');p.className='pilot';p.innerHTML='🪂<br>'+['🧑‍✈️','👩‍✈️','👨‍✈️'][i];document.body.appendChild(p);
pilots.push({el:p,x:W()*(0.2+0.3*i)-40,y:top,ph:Math.random()*6})}}
function puff(){const d=document.createElement('div');d.className='puff';document.body.appendChild(d);
const px=x+rw()*0.08,py=y+rh()*0.5,s=performance.now();(function step(n){const k=(n-s)/900;if(k>=1){d.remove();return}
d.style.transform=`translate(${px-40*k-15}px,${py-15}px) scale(${1+k*1.5})`;d.style.opacity=.8*(1-k);requestAnimationFrame(step)})(s)}
let lastPuff=0;
function frame(n){const t=(n-t0)/1000;
if(state==='enter'){const tx=(W()-rw())/2;x+= (tx-x)*0.06;y=H()*0.42-rh()/2+Math.sin(n/500)*15;if(Math.abs(tx-x)<3){state='fly';t0=n}}
else if(state==='fly'){const ax=Math.max(10,(W()-rw())/2-20);x=(W()-rw())/2+Math.sin(t*0.8)*Math.min(ax,W()*0.08);y=H()*0.42-rh()/2+Math.sin(t*1.7)*Math.min(30,H()*0.04)}
else if(state==='grow'){const k=Math.min(t/2,1);scale=1+k*1.3+Math.sin(t*14)*0.06*(1-k*0.3);
if(k>=1){state='pop';pop();pops++;starsEl.textContent='⭐ x '+pops;rocket.style.opacity=0;burst();t0=n;setSign('THEY FLOAT DOWN! 🪂')}}
else if(state==='pop'||state==='float'){state='float';let landed=true;const ground=H()*0.86;
pilots.forEach(p=>{const h=p.el.offsetHeight;if(p.y+h<ground){p.y+=H()*0.0018;landed=false}else p.y=ground-h;
p.el.style.transform=`translate(${p.x+Math.sin(n/600+p.ph)*15}px,${p.y}px) rotate(${Math.sin(n/400+p.ph)*8}deg)`});
if(landed){state='land';t0=n;chime();setSign('YAY! THEY ARE OK! 🎉');pilots.forEach(p=>p.el.innerHTML='👋<br>'+p.el.innerHTML.split('<br>')[1])}}
else if(state==='land'){if(t>2.5){pilots.forEach(p=>p.el.remove());pilots=[];enter()}}
if((state==='enter'||state==='fly')&&n-lastPuff>350){lastPuff=n;puff()}
place();requestAnimationFrame(frame)}
addEventListener('resize',()=>{if(state==='fly'||state==='enter')y=H()*0.42-rh()/2});
enter();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
